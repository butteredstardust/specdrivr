packages:
  - .

# Do not auto-install optional peer dependencies.
#
# drizzle-orm and better-auth declare every database driver and adapter they
# support as optional peers (prisma, mysql2, better-sqlite3, pglite, ...).
# With autoInstallPeers on, pnpm pulled all of them into the lockfile even
# though this project only ever uses `pg` / `postgres`. That dead subtree was
# the source of the large majority of `pnpm audit` findings and made the
# Security workflow fail every week on vulnerabilities in code we never load.
#
# Every peer this project actually needs is declared explicitly in
# package.json. If an install starts warning about a genuinely missing peer,
# add it to package.json rather than turning this back on.
autoInstallPeers: false
# Escape hatch for advisories with no published fix. Add the GHSA id here with
# a comment naming the package, why the risk is acceptable, and when to
# recheck - then remove the entry once upstream ships a patch. Prefer this over
# lowering the `--audit-level=high` threshold in .github/workflows/security.yml,
# because it keeps the exception visible and scoped to one advisory.
#
# auditConfig:
#   ignoreGhsas:
#     - GHSA-xxxx-xxxx-xxxx # <package>: <reason>, recheck <date>
