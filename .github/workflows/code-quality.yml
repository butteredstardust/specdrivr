name: Code Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Check for forbidden fix scripts
        run: |
          if [ -f "fix-tsc.sh" ] || [ -f "fix-lint2.sh" ] || ls fix-*.sh 1> /dev/null 2>&1; then
            echo "❌ ERROR: Temporary fix scripts found!"
            echo "Remove these scripts before committing:"
            ls fix-*.sh 2>/dev/null || true
            exit 1
          fi
          echo "✅ No temporary fix scripts found"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: |
          pnpm lint
          if [ $? -ne 0 ]; then
            echo "❌ ESLint found issues. Please fix them."
            exit 1
          fi
          echo "✅ ESLint passed"

      - name: Run TypeScript type check
        run: |
          pnpm tsc --noEmit
          if [ $? -ne 0 ]; then
            echo "❌ TypeScript errors found. Please fix them."
            exit 1
          fi
          echo "✅ TypeScript type check passed"

      - name: All checks passed
        run: echo "✅ All code quality checks passed!"