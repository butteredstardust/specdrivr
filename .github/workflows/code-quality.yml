name: Code Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: '--dns-result-order=ipv4first'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/specdrivr_test
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: test-secret-for-ci-must-be-32-chars-long
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: test-secret-for-ci-must-be-32-chars-long

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specdrivr_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Check for forbidden artifacts
        run: |
          FORBIDDEN_PATTERNS=(
            "fix-*.sh"
            "fix-*.cjs"
            "temp-*.ts"
            "*.tmp"
            "*.bak"
            ".env.local"
            "*.orig"
            "db_backup.sql"
            "debug.log"
          )

          FOUND=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            if ls $pattern 1> /dev/null 2>&1; then
              echo "Error: Forbidden artifact detected: $(ls $pattern)"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "No forbidden artifacts found."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify hook integrity
        run: |
          # Verify that hooks are configured correctly even if local hooks were bypassed
          # This runs the same checks that the pre-push hook runs
          node scripts/verify-hooks.js verify
          node scripts/verify-hooks.js check-git
          echo "✓ Hook integrity verified"

      - name: Run database migrations
        run: pnpm db:migrate

      # - name: Security and integrity audit
      #   run: |
      #     pnpm audit --prod
      #     # TODO: Re-enable better-auth doctor once CLI tooling is resolved
      #     # if [ -f "src/lib/auth.ts" ]; then pnpm exec better-auth doctor; fi

      - name: Lint Next.js and React standards
        run: |
          # Enforces Next.js 15 async request patterns and React 19 rules
          pnpm run lint

      - name: Type check
        run: |
          pnpm tsc --noEmit

      - name: Execute tests
        run: |
          # Validates Zod schemas and business logic
          pnpm vitest run

      # - name: Detect unused code
      #   run: |
      #     # NOTE: Temporarily disabled during active UI development to avoid noise from unused server actions/components.
      #     # TODO: Re-enable once the core UI work is finished.
      #     pnpm dlx knip

      - name: Final status
        run: echo "Quality checks completed successfully."
