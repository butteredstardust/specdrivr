name: Code Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Check for forbidden artifacts
        run: |
          FORBIDDEN_PATTERNS=(
            "fix-*.sh"
            "fix-*.cjs"
            "temp-*.ts"
            "*.tmp"
            "*.bak"
            ".env.local"
            "*.orig"
            "db_backup.sql"
            "debug.log"
          )
          
          FOUND=0
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            if ls $pattern 1> /dev/null 2>&1; then
              echo "Error: Forbidden artifact detected: $(ls $pattern)"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "No forbidden artifacts found."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security and integrity audit
        run: |
          pnpm audit --prod
          if [ -f "auth.ts" ]; then pnpm exec better-auth doctor || true; fi

      - name: Lint Next.js and React standards
        run: |
          # Enforces Next.js 15 async request patterns and React 19 rules
          pnpm next lint

      - name: Type check
        run: |
          pnpm tsc --noEmit

      - name: Execute tests
        run: |
          # Validates Zod schemas and business logic
          pnpm vitest run

      - name: Detect unused code
        run: |
          pnpm dlx knip

      - name: Final status
        run: echo "Quality checks completed successfully."