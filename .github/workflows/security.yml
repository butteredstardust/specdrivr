name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly Monday midnight UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 10.28.2
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Fails on any high or critical advisory. If a fix is not yet published
      # upstream, add the GHSA id to `auditConfig.ignoreGhsas` in
      # pnpm-workspace.yaml with a comment saying why and when to revisit -
      # do not lower this threshold.
      - run: pnpm audit --audit-level=high

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # On pull_request the action diffs base..head; on push it diffs the
      # pushed range; on schedule/workflow_dispatch both are empty and it
      # rescans all of history. Known-safe placeholder credentials are
      # filtered by .github/trufflehog-exclude.txt - see that file before
      # adding anything to it.
      - uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          path: ./
          # Pinned so a new detector release cannot turn main red without a
          # commit. Bump alongside the action SHA above.
          version: 3.97.4
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --exclude-paths=.github/trufflehog-exclude.txt

  # TODO: Re-enable once @better-auth/cli ships a stable 1.5.x release.
  # better-auth@1.5.5 has no CLI binary; the doctor command lives in the
  # separate @better-auth/cli package whose latest stable release (1.4.21)
  # targets better-auth@1.4.x. Track: https://github.com/better-auth/better-auth
