name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_OPTIONS: "--dns-result-order=ipv4first"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/specdrivr_test
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: test-secret-for-ci-must-be-32-chars-long
      REDIS_URL: redis://127.0.0.1:6379
      BETTER_AUTH_SECRET: test-secret-for-ci-must-be-32-chars-long

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specdrivr_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Check for forbidden artifacts
        run: |
          if [ -f "fix-tsc.sh" ] || [ -f "fix-lint2.sh" ] || ls fix-*.mjs 1> /dev/null 2>&1; then
            echo "Error: Temporary fix scripts found."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Run unit tests
        run: pnpm vitest run
        env:
          CI: true

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
