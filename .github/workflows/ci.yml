name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: '--dns-result-order=ipv4first'
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/specdrivr_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/specdrivr_test
      BETTER_AUTH_SECRET: ci-test-secret-not-used-in-production-32ch
      NEXTAUTH_SECRET: ci-test-secret-not-used-in-production-32ch
      RESEND_API_KEY: re_test_ci_placeholder
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: specdrivr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Run unit tests
        id: unit-tests
        run: pnpm test:unit
      # E2E tests intentionally omitted — suite has only 2 smoke tests and requires
      # a running server. Add `pnpm test:e2e` here once the suite is mature.
      - name: Write test summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.unit-tests.outcome }}" = "success" ]; then
            echo "✅ All unit tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Unit tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Env vars required for Next.js production build env validation (see src/lib/env-core.ts).
      # DATABASE_URL needs valid URL format; no real DB connection is made during build.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/specdrivr_test
      BETTER_AUTH_SECRET: ci-test-secret-not-used-in-production-32ch
      CRON_SECRET: ci-cron-secret-not-used-in-production-32chars
      RESEND_API_KEY: re_test_ci_placeholder
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
        with:
          version: 9
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
