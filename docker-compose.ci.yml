services:
  runner:
    build:
      context: ..
      dockerfile: .ci/Dockerfile.runner
    volumes:
      - ..:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/specdrivr_test
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=test-secret-for-ci-must-be-32-chars-long
      - BETTER_AUTH_SECRET=test-secret-for-ci-must-be-32-chars-long
      - RESEND_API_KEY=re_dummy_key_for_ci
      - RESEND_FROM_EMAIL=noreply@specdrivr.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=specdrivr_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
